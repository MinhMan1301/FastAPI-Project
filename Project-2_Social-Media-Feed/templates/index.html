<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="bolt"></span></div>
  <div class="field" aria-hidden="true"></div>

  <main class="layout">
    <section class="intro">
      <p class="badge">Weather dashboard</p>
      <h1>Storm<br>with Heavy Rain</h1>
      <p class="lead">Sign in to see live forecasts, rain alerts and wind updates for your region.</p>
    </section>

    <section class="card" aria-labelledby="title">
      <h2 id="title">Sign in</h2>
      <p class="sub">Use your account to continue.</p>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required>
          <button type="button" id="toggle" aria-label="Show password">Show</button>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox" id="remember"> Keep me signed in</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn">Sign in</button>
      </form>

      <p class="foot">No account yet? <a href="#">Create one</a></p>
    </section>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
